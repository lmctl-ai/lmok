name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only:
        description: "Run a single matrix job (or 'all')"
        required: true
        default: "all"
        type: choice
        options: [all, linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]

# tree-sitter upstream is portable C and the vendored lmcode-cpp SDK is
# standard-library-only C++17 with _WIN32 paths, so the matrix covers Linux,
# macOS, and Windows (MinGW). Every main push builds and tests the five
# binaries; when ALL pass it (1) updates the rolling `dist` branch and
# (2) cuts a GitHub Release when binary inputs changed since the latest v* tag
# (version = scripts/next-version.sh:
# latest v* tag + 1 patch, or CMakeLists' VERSION when that is higher). The
# version is stamped into the ephemeral workspace before the build so that
# `lmok --version` equals the release tag (lmscript install ...@latest checks
# that). A manual v* tag push still publishes that tag with the same binaries.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: v
        run: echo "version=$(scripts/next-version.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-15,         name: macos-arm64 }
          - { os: macos-15-intel,   name: macos-x64 }
          - { os: windows-2022,     name: windows-x64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    env:
      LMOK_TEST_PLATFORM: ${{ matrix.name }}
      ONLY_OK: ${{ github.event_name != 'workflow_dispatch' || inputs.only == 'all' || matrix.name == inputs.only }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.ONLY_OK == 'true'
        with:
          persist-credentials: false

      - name: stamp the release version (workspace only, not committed)
        if: env.ONLY_OK == 'true'
        run: |
          sed -i.bak "s/^project(lmok VERSION [0-9.]*/project(lmok VERSION ${{ needs.version.outputs.version }}/" CMakeLists.txt
          rm -f CMakeLists.txt.bak
          grep -n '^project(lmok' CMakeLists.txt

      - name: sync deps (deps.lock) and verify vendored sdk headers
        if: env.ONLY_OK == 'true'
        run: |
          scripts/sync-deps.sh
          scripts/sync-sdk.sh --verify

      - name: toolchain (linux)
        if: runner.os == 'Linux' && env.ONLY_OK == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: toolchain (macos)
        if: runner.os == 'macOS' && env.ONLY_OK == 'true'
        run: brew install ninja coreutils

      - name: toolchain (windows)
        if: runner.os == 'Windows' && env.ONLY_OK == 'true'
        run: |
          for i in 1 2 3; do
            command -v g++ >/dev/null 2>&1 && command -v ninja >/dev/null 2>&1 && break
            choco install -y mingw ninja && break || sleep 15
          done
          command -v g++ >/dev/null 2>&1 || exit 1
          command -v ninja >/dev/null 2>&1 || exit 1

      - name: lmscript compiler (npm @lmctl-ai/lmctl, lmcode bytecode (DSLB v6))
        if: env.ONLY_OK == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: install and probe the compiler
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          # The npm CLI package ships no compiler library (dist/dsl.js), which
          # fixture compilation imports; build the pinned workspace instead.
          # The pin lives in compiler.lock (aligned with scripts/select-compiler.sh).
          LMSCRIPT_BIN="$(scripts/bootstrap-compiler.sh)"
          echo "LMSCRIPT_BIN=$LMSCRIPT_BIN" >> "$GITHUB_ENV"
          scripts/select-compiler.sh | tee compiler.txt
          grep -q lmscript compiler.txt || { echo "no v6 compiler available"; exit 1; }

      - name: build and test
        if: env.ONLY_OK == 'true'
        shell: bash
        run: ./test.sh

      - name: lmok ci planted-finding gate
        if: env.ONLY_OK == 'true'
        run: python3 tests/check-ci-planted.py build/lmok

      - name: package artifact
        if: env.ONLY_OK == 'true'
        shell: bash
        run: |
          mkdir -p dist
          suffix=""; [ "$RUNNER_OS" = Windows ] && suffix=.exe
          cp "build/lmok${suffix}" "dist/lmok-${{ matrix.name }}${suffix}"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.ONLY_OK == 'true'
        with:
          name: lmok-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  # Push-and-publish: on every main push (and full manual re-runs) collect
  # the matrix binaries and force-update the rolling `dist` branch, so the
  # latest per-OS executables live at permanent URLs. No approval, no
  # release object; the branch head is always "the latest main build".
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push to the dist branch
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmok-*
          path: ${{ runner.temp }}/bins
          merge-multiple: true

      - name: checksums
        run: (cd "${{ runner.temp }}/bins" && sha256sum lmok-* > SHA256SUMS)

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true # the token must land in .git/config for the push
          fetch-depth: 1

      - name: update the dist branch
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin dist && git rev-parse -q --verify FETCH_HEAD; then
            git checkout -B dist FETCH_HEAD
          else
            git checkout --orphan dist
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp "${{ runner.temp }}/bins"/lmok-* "${{ runner.temp }}/bins"/SHA256SUMS .
          cp LICENSE THIRD_PARTY_NOTICES.md . 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "dist branch already up to date"
          else
            git commit -m "dist: lmok binaries from ${GITHUB_SHA}"
          fi
          git push --force-with-lease origin dist

  # Release only changed binary inputs after a green main push (or a manual v*
  # tag push) the same five tested binaries become a GitHub Release. On main
  # the tag is created by `gh release create --target $GITHUB_SHA`; tags made
  # with GITHUB_TOKEN do not start another workflow run.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether binary inputs warrant a release
        id: release_gate
        run: python3 scripts/release-needed.py

      - if: steps.release_gate.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lmok-*
          path: dist
          merge-multiple: true

      - name: Check five release assets and checksums
        if: steps.release_gate.outputs.publish == 'true'
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'lmok-*' | wc -l)" -eq 5
          (cd dist && sha256sum lmok-* > SHA256SUMS)

      - name: Publish release
        if: steps.release_gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ needs.version.outputs.version }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already published; preserving its verified assets and checksums."
          else
            gh release create "$tag" dist/lmok-* dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --latest \
              --notes "Five tested platform binaries (Linux x64/arm64, macOS arm64/x64, Windows x64) plus SHA256SUMS, built from ${GITHUB_SHA}. lmscript install github:lmctl-ai/lmok@${tag}. Rolling latest-main builds live on the dist branch."
          fi
